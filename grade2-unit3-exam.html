    case 'sugg': { pushH(); const x=w.doc[w.ctx]; x.t=a; delete x.bad; w.ctx=null; return; }
    default: return;
  }
}

/* =====================================================================
   UNIT 3 FINAL EXAM ENGINE (shared by Grade 1, 2 and 3)
   - the teacher picks the class and the student's name
   - every student gets a different version (questions from pools,
     question and answer order shuffled), always 25 marks
   - one question at a time, no right/wrong messages during the exam
   - at the end: the mark out of 25 and a picture review of every
     wrong answer with the right answer
   - results: saved on this device AND sent to the teacher's Google

const app = document.getElementById('app');

const strip = s => String(s==null?'':s).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
/* shuffle so that the order is never the same as the book/answer order (if possible) */
const mix = a => { if (a.length<2) return [...a]; for (let k=0;k<12;k++){ const b=shuffle(a); if (b.some((x,i)=>x!==a[i])) return b; } return [...a].reverse(); };

/* ---------- storage (works even if the browser blocks saving) ---------- */

const MAXMARK = 25;
const markOf = it => it.type==='place' ? it.cards.length : (it.marks||1);
function buildItems(){
  const out=[];
  EXAM.sections.forEach((s,si)=>{
    let list=[];
    s.items.forEach(x=>{
      if (x && x.pool) shuffle(x.pool).slice(0, x.take||1).forEach(y=>list.push(y));
      else list.push(x);
    });
    list = list.map(x => typeof x==='function' ? x() : x);
    if (s.keepOrder!==true) list = shuffle(list);
    list.forEach(it=>out.push(Object.assign({}, it, {sec:s.title, secAr:s.ar, si})));
  });
  out.forEach((it,i)=>{ it.n=i+1; it.marks=markOf(it); });
  return out;
}

let AC=null;
function tone(seq){ try { AC = AC || new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime;
  seq.forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=f; o.type='sine'; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d); t+=d*.9; }); } catch(e){} }
const tick = () => tone([[660,.06]]);
let VOICE=null;
function pickVoice(){ try { const v=speechSynthesis.getVoices(); VOICE = v.find(x=>/^en[-_](US|GB)/i.test(x.lang) && /female|samantha|google/i.test(x.name)) || v.find(x=>/^en[-_](US|GB)/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || null; } catch(e){} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch(e){}
function speak(text){ try { speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(strip(text)); u.lang='en-US'; if (VOICE) u.voice=VOICE; u.rate=.85; speechSynthesis.speak(u); } catch(e){} }

/* =====================================================================
   RESULTS FROM EVERY DEVICE (Google Sheet)
   ===================================================================== */
function sheetCache(){ return LS.get(SHK, {at:null, ok:null, rows:[]}); }
/* every result we know: this device + the Sheet (results from other devices) */
function knownResults(){
  const loc=allResults(), ids=new Set(loc.map(r=>r.id));
  return [...loc, ...sheetCache().rows.filter(r=>!ids.has(r.id))];
}
function sheetToRec(x){
  const dm=String(x.date||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/), tm=String(x.time||'').match(/(\d{1,2}):(\d{2})/);
  const d = dm ? new Date(+dm[3], +dm[2]-1, +dm[1], tm?+tm[1]:0, tm?+tm[2]:0) : new Date();
  const items = String(x.details||'').split(' | ').slice(1).map(s=>{ const m=s.match(/^(\d+)\.\s(.*):\s(\d+)\/(\d+)$/); return m ? {n:+m[1], q:m[2], got:+m[3], max:+m[4], a:'', ok:''} : null; }).filter(Boolean);
  return { id:String(x.id), grade:+x.grade||EXAM.grade, cls:String(x.cls), name:String(x.name), start:d.toISOString(), end:null, status:'finished',
    score:+x.score||0, max:+x.max||MAXMARK, items, nItems:items.length, sent:true, src:'sheet', mins:x.minutes };
}
/* read the Sheet (needs the Apps Script with doGet, see Teacher › Google Sheet) */
function loadSheet(timeout=12000){
  return new Promise(res=>{
    if (!EXAM.sheet || !navigator.onLine){ res(false); return; }
    const cb='__u3cb'+Date.now()+Math.floor(Math.random()*1000), s=document.createElement('script');
    let done=false; const fin=(ok, rows)=>{ if (done) return; done=true; try { delete window[cb]; } catch(e){ window[cb]=undefined; } s.remove(); clearTimeout(t);
      const c=sheetCache(); c.ok=ok; if (ok){ c.at=new Date().toISOString(); c.rows=rows.map(sheetToRec); confirmSent(c.rows); } LS.set(SHK, c); res(ok); };
    window[cb]=data=>fin(Array.isArray(data), Array.isArray(data)?data:[]);
    const t=setTimeout(()=>fin(false), timeout);
    s.onerror=()=>fin(false);
    s.onload=()=>setTimeout(()=>fin(false), 300);   /* loaded but no answer = old script without doGet */
    s.src=EXAM.sheet+'?status='+encodeURIComponent(STATUS)+'&grade='+EXAM.grade+'&callback='+cb+'&t='+Date.now();
    document.head.appendChild(s);
  });
}
/* a result is "safe" when we have seen it in the Sheet */
function confirmSent(rows){
  const ids=new Set(rows.map(r=>r.id)), all=allResults(); let ch=false;
  all.forEach(r=>{ if (ids.has(r.id) && !r.conf){ r.conf=true; r.sent=true; ch=true; } });
  if (ch) saveResults(all);
}
function sheetRow(r){
  const d=new Date(r.start), mins=r.end?Math.max(1,Math.round((new Date(r.end)-d)/60000)):'';
  return { date:d.toLocaleDateString('en-GB'), time:d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), grade:String(r.grade), name:r.name, cls:r.cls,
    score:r.score, max:r.max, pct:Math.round(r.score/r.max*100), minutes:mins, status:STATUS,
    details:'UNIT 3 FINAL EXAM | '+r.items.filter(Boolean).map(x=>`${x.n}. ${x.q.replace(/\s\|\s/g,' / ')}: ${x.got}/${x.max}`).join(' | '), id:r.id };
}
function sendRec(r){
  if (!EXAM.sheet || !settings().sheetOn || r.status!=='finished' || !navigator.onLine) return Promise.resolve(false);
  return fetch(EXAM.sheet,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(sheetRow(r))})
    .then(()=>{ const all=allResults(), k=all.findIndex(x=>x.id===r.id); if (k>=0){ all[k].sent=true; all[k].tries=(all[k].tries||0)+1; saveResults(all); } return true; })
    .catch(()=>false);
}
/* send what is not in the Sheet yet. Results that were sent but never seen in the Sheet are sent again
   only when the Sheet can be read (the new script skips a result it already has, so nothing is doubled). */
let syncing=false;
async function syncAll(){
  if (syncing || !EXAM.sheet || !settings().sheetOn || !navigator.onLine) return;
  syncing=true;

const SHEET_CODE = `function doPost(e) {
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
    var d = JSON.parse(e.postData.contents);

    }

function doGet(e) {
  var p = e.parameter || {};
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
  var v = sheet.getDataRange().getDisplayValues();
  var out = [];
  for (var i = 1; i < v.length; i++) {
    var r = v[i];
    if (p.status && r[9] !== p.status) continue;
    if (p.grade && String(r[2]) !== String(p.grade)) continue;
    out.push({date: r[0], time: r[1], grade: r[2], name: r[3], cls: r[4], score: r[5],
              max: r[6], minutes: r[8], status: r[9], details: r[10], id: r[11]});
  }
  var json = JSON.stringify(out);
  var cb = p.callback;
  if (cb && /^[A-Za-z_$][0-9A-Za-z_$]*$/.test(cb)) {
    return ContentService.createTextOutput(cb + '(' + json + ')')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }

}`;

RENDER.place = (it, B) => {
  const sort = it.mode==='sort';
  const targets = sort ? it.bins.map((b,i)=>({id:'t'+i, ...b})) : mix(it.cards.map((c,i)=>({id:'t'+i, pic:c.pic, html:c.html, alt:c.t})));
  const cards = it.cards.map((c,i)=>({id:'c'+i, t:c.t, ar:c.ar, ico:c.ico, want: sort ? 't'+c.bin : 't'+i}));
  const trayOrder = mix(cards.map(c=>c.id));
  const pos = {}; cards.forEach(c=>pos[c.id]=null);
  let sel = null;
  const cardHTML = c => `<button class="card-t${sel===c.id?' sel':''}" data-c="${c.id}">${c.ico?`<span class="emo">${c.ico}</span>`:''}<span>${c.t}${c.ar?`<span class="ar">${c.ar}</span>`:''}</span></button>`;
  const byId = id => cards.find(c=>c.id===id);
  function draw(){
    const inT = tid => cards.filter(c=>pos[c.id]===tid);
    const tray = trayOrder.filter(id=>pos[id]===null).map(byId);
    B.innerHTML = `<div class="place${sel?' armed':''}">
      <div class="targets m${targets.length}">${targets.map(t=> sort
        ? `<div class="bin" data-t="${t.id}" style="border-color:${t.color}"><div class="bh" style="background:${t.color}"><span class="emo">${t.ico}</span><span>${t.t}${t.ar?`<span class="ar" style="color:#fff">${t.ar}</span>`:''}</span></div><div class="slot${inT(t.id).length?'':' empty'}">${inT(t.id).map(cardHTML).join('')}</div></div>`
        : `<div class="tgt" data-t="${t.id}"><div class="tp">${t.html?`<div class="big">${t.html}</div>`:picHTML(t.pic, '')}</div><div class="slot${inT(t.id).length?'':' empty'}">${inT(t.id).map(cardHTML).join('')}</div></div>`).join('')}</div>
      <div class="tray${tray.length?'':' empty'}" data-t="tray">${tray.map(cardHTML).join('')}</div>
    </div>`;

  }
  function put(cid, tid){
    if (tid==='tray'){ pos[cid]=null; }

  }
  /* tap: pick a card, then tap a place. drag: move it there. */

    const c=e.target.closest('.card-t'); if (!c || e.button>0) return;
    drag={id:c.dataset.c, x:e.clientX, y:e.clientY, el:c, ghost:null, moved:false, pid:e.pointerId};
  });
  const onMove = e=>{
    if (!drag || e.pointerId!==drag.pid) return;
    if (!drag.moved && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 10) return;
    if (!drag.moved){ drag.moved=true; const r=drag.el.getBoundingClientRect(); const g=drag.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel'); g.style.width=r.width+'px'; g.style.left=r.left+'px'; g.style.top=r.top+'px'; document.body.appendChild(g); drag.ghost=g; drag.dx=drag.x-r.left; drag.dy=drag.y-r.top; drag.el.classList.add('lift'); }
    drag.ghost.style.left=(e.clientX-drag.dx)+'px'; drag.ghost.style.top=(e.clientY-drag.dy)+'px';
    $$('[data-t]',B).forEach(t=>t.classList.remove('over'));
    const t=document.elementFromPoint(e.clientX,e.clientY); const tt=t && t.closest('#qbody [data-t]'); if (tt && tt.dataset.t!=='tray') tt.classList.add('over');
    e.preventDefault();
  };
  const onUp = e=>{
    if (!drag || e.pointerId!==drag.pid) return; const d=drag; drag=null;
    if (d.moved){ d.ghost.remove(); const t=document.elementFromPoint(e.clientX,e.clientY); const tt=t && t.closest('#qbody [data-t]');

    if (B.dataset.dragged) return;
    const c=e.target.closest('.card-t');
    if (c){ const id=c.dataset.c;
      if (sel===id){ sel=null; draw(); return; }

      got: cards.filter(c=>pos[c.id]===c.want).length,
      a: cards.map(c=>`${strip(c.t)} → ${pos[c.id]===null?'—':tName(pos[c.id])}`).join('; '),
      ok: cards.map(c=>`${strip(c.t)} → ${tName(c.want)}`).join('; ') }; };
};

    const c=it.choices[it.ok];

    if (r.sel!=null && r.sel!==it.ok){ const y=it.choices[r.sel]; yours = `<div class="rvpick no">${y.pic||y.ico?`<span class="rvpic">${picHTML(y.pic||y.ico, y.t)}</span>`:''}<b>${y.t||y.nm}</b></div>`; }
  } else if (it.type==='place'){
    if (it.mode==='sort') right = `<div class="rvsort">${it.bins.map((b,bi)=>`<div class="rvbin" style="border-color:${b.color}"><div class="rvbh" style="background:${b.color}">${b.ico} ${b.t}</div>${it.cards.filter(c=>c.bin===bi).map(c=>`<span class="rvcard${r.pos && r.pos['c'+it.cards.indexOf(c)]!=='t'+bi?' miss':''}">${c.ico||''} ${c.t}</span>`).join('')}</div>`).join('')}</div>`;
    else right = `<div class="rvmatch">${it.cards.map((c,ci)=>`<div class="rvpair${r.pos && r.pos['c'+ci]!=='t'+ci?' miss':''}"><span class="rvpic">${c.html?`<span class="rvbig">${c.html}</span>`:picHTML(c.pic,'')}</span><span class="rvcard">${c.t}</span></div>`).join('')}</div>`;
  } else if (it.type==='part'){
    right = staticWord(it.part, it.doc) + `<div class="rvname">👆 ${EXAM.partNames[it.part]}</div>`;
  } else if (it.type==='task'){
    right = `<div class="rvsteps">${(it.how||[]).map(stepChip).join('<span class="harrow">➜</span>')}</div>`;
  }
  return `<div class="rv"><div class="rvhead"><span class="rvn">${it.n}</span><div class="rvq">${it.q}${it.ar?`<div class="ar">${it.ar}</div>`:''}</div><span class="rvm">${got} / ${it.marks}</span></div>
    ${yours?`<div class="rvrow"><span class="rvlab no">✗ Your answer</span>${yours}</div>`:''}
    <div class="rvrow"><span class="rvlab ok">✓ Right answer</span>${right}</div></div>`;
}
let EX_LAST=null;
function viewEnd(rec, items){
  EX_LAST={rec, items};
  bar(); applyAr();
  const p=Math.round(rec.score/rec.max*100), stars = rec.score>=22?3 : rec.score>=15?2 : 1;
  const msg = rec.score>=22?'Excellent!' : rec.score>=18?'Very good!' : rec.score>=13?'Good job!' : 'Well done for trying!';
  const msgAr = rec.score>=22?'ممتاز!' : rec.score>=18?'جيد جداً!' : rec.score>=13?'عمل جيد!' : 'أحسنت المحاولة!';

    <div class="endbtns">${wrong.length?`<button class="go" id="seeRev" style="max-width:420px;background:var(--blue);box-shadow:0 6px 0 #0f5aa0">👀 See my answers</button>`:''}<button class="go" id="nextStu" style="max-width:420px">Next student ➜</button></div>
    ${wrong.length?'':`<p style="font-weight:700;font-size:20px">All your answers are right! 🎉<span class="ar">كل إجاباتك صحيحة!</span></p>`}
  </div></div>
  ${wrong.length?`<section class="review hide" id="review"><h2>Let's look at the answers 👀</h2><div class="ar" style="font-size:20px">لنرَ الإجابات الصحيحة</div>
    <p class="tp-note">${wrong.length} question${wrong.length>1?'s':''} to learn from:</p>${wrong.map(reviewCard).join('')}

  </main>`;
  applyAr(); if (rec.score*2>=rec.max) confetti(); tone([[523,.12],[659,.12],[784,.12],[1046,.25]]);
  /* Word pictures in the review: mark the right part, scale to the box */
  $$('.rvword').forEach(b=>{ const s=b.clientWidth/720; b.querySelector('.rvwin').style.setProperty('--s', s); b.style.height=(450*s)+'px';
    $$(`[data-part="${b.dataset.partOn}"]`, b).forEach(x=>x.classList.add('picked')); });
  $('#nextStu').onclick=()=>viewStart();
  if ($('#nextStu2')) $('#nextStu2').onclick=()=>viewStart();
  if ($('#seeRev')) $('#seeRev').onclick=()=>{ const cf=$('#confetti'); if (cf) cf.remove(); $('#review').classList.remove('hide');
    $$('.rvword').forEach(b=>{ const s=b.clientWidth/720; b.querySelector('.rvwin').style.setProperty('--s', s); b.style.height=(450*s)+'px'; });
    $('#review').scrollIntoView({behavior:'smooth'}); };
}
function confetti(){
  const c=document.createElement('canvas'); c.id='confetti'; document.body.appendChild(c);
  const x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#F2562B','#3FA72A','#1C83E0','#FFC21A','#8C5BE0','#E8559A'];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:6+Math.random()*8,a:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let n=0; (function f(){ x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore();}); if(++n<170) requestAnimationFrame(f); else c.remove(); })();
}

const TPF = { cls:null, open:null, sort:'time', view:'results', msg:'' };
function viewTeacher(){
  EX.rec=null; document.body.classList.remove('in-exam'); cleanup();
  bar(); applyAr();
  if (!TPF.cls) TPF.cls = settings().cls || EXAM.classes[0];
  if (TPF.view==='lists') return viewLists();
  if (TPF.view==='sheet') return viewSheet();
  const sc=sheetCache();
  const list = knownResults().filter(r=>TPF.cls==='all' || r.cls===TPF.cls);
  list.sort(TPF.sort==='name' ? (a,b)=>a.name.localeCompare(b.name) || a.start.localeCompare(b.start) : TPF.sort==='mark' ? (a,b)=>b.score-a.score : (a,b)=>a.start.localeCompare(b.start));
  const fin = list.filter(r=>r.status==='finished');
  const avg = fin.length ? (fin.reduce((a,r)=>a+r.score,0)/fin.length) : 0;
  const waiting = allResults().filter(r=>r.status==='finished' && !r.conf).length;
  const tabs = (EXAM.classes.length>1 ? [...EXAM.classes,'all'] : EXAM.classes);
  const fmtAt = s => { const d=new Date(s); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };
  app.innerHTML = `<main>
    <div class="tp-head"><h2>📋 Exam results · Grade ${EXAM.grade}${EXAM.examDate?` · Exam date ${esc(EXAM.examDate)}`:''}</h2>
      <button class="tp-btn noprint" id="tpBack">‹ Back to the exam</button></div>
    ${EXAM.sheet?`<div class="sync noprint ${sc.ok?'ok':sc.ok===false?'bad':''}">
      <span>${sc.ok ? `☁️ <b>All devices</b>: results from the Google Sheet, updated ${fmtAt(sc.at)}.` : sc.ok===false ? `⚠️ Showing <b>this device only</b>. The Google Sheet could not be read${navigator.onLine?' (the Sheet script needs the new version, see Google Sheet setup)':' (no internet)'}.` : `Showing this device. Tap the button to add the results of the other devices.`}
      ${waiting?`<br>⏳ ${waiting} result${waiting>1?'s':''} on this device ${waiting>1?'are':'is'} waiting to reach the Sheet. ${navigator.onLine?'':'It will be sent when there is internet.'}`:''}${TPF.msg?`<br>${TPF.msg}`:''}</span>
      <button class="tp-btn g" id="syncBtn">↻ Get all devices' results</button></div>`:''}
    <div class="tp-tabs">${tabs.map(c=>`<button class="tp-tab${TPF.cls===c?' on':''}" data-c="${c}">${c==='all'?'All classes':clsName(c)}</button>`).join('')}</div>
    <div class="tp-head noprint" style="margin-bottom:10px">
      <button class="tp-btn g" id="csvBtn">⬇ Excel (CSV)</button>
      <button class="tp-btn" id="prBtn">🖨 Print</button>
      <button class="tp-btn" id="listBtn">👥 Class lists</button>
      ${EXAM.sheet?`<button class="tp-btn" id="shBtn">☁️ Google Sheet setup</button>`:''}
      <span style="flex:1"></span>
      <span class="tp-note">Sort:</span>
      ${[['time','Time'],['name','Name'],['mark','Mark']].map(s=>`<button class="tp-btn${TPF.sort===s[0]?' g':''}" data-sort="${s[0]}">${s[1]}</button>`).join('')}
    </div>
    <div class="stats">
      <div class="stat"><small>Finished</small><b>${fin.length}</b></div>
      <div class="stat"><small>Average</small><b>${fin.length?avg.toFixed(1):'–'} <span style="font-size:18px;color:var(--soft)">/ ${MAXMARK}</span></b></div>
      <div class="stat"><small>Highest</small><b>${fin.length?Math.max(...fin.map(r=>r.score)):'–'}</b></div>
      <div class="stat"><small>Lowest</small><b>${fin.length?Math.min(...fin.map(r=>r.score)):'–'}</b></div>
    </div>
    ${list.length ? `<table class="rtable"><thead><tr><th>#</th><th>Name</th><th>Class</th><th>Mark</th><th class="hide-s">Date</th><th class="hide-s">Time</th><th>Status</th><th class="noprint"></th></tr></thead><tbody>
      ${list.map((r,i)=>{ const d=new Date(r.start); const n=r.nItems||NQ; return `<tr class="row" data-id="${r.id}"><td>${i+1}</td><td><b>${esc(r.name)}</b>${r.src==='sheet'?' <span class="tag dev" title="Tested on another device">other device</span>':''}</td><td>${esc(clsName(r.cls).replace('Grade ',''))}</td>
        <td><span class="mk">${r.score}</span> / ${r.max}<span class="mkbar"><i style="width:${Math.round(r.score/r.max*100)}%"></i></span></td>
        <td class="hide-s">${d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</td><td class="hide-s">${d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</td>
        <td><span class="tag ${r.status==='finished'?'fin':r.status==='stopped'?'stop':'run'}">${r.status}</span>${r.src!=='sheet' && r.status==='finished' && EXAM.sheet?(r.conf?' <span title="In the Google Sheet">☁️✓</span>':' <span title="Not in the Google Sheet yet">⏳</span>'):''}</td>
        <td class="noprint">${r.src==='sheet'?'':`<button class="tp-btn r" data-del="${r.id}" aria-label="Delete">🗑</button>`}</td></tr>
        <tr class="det${TPF.open===r.id?'':' hide'}" data-det="${r.id}"><td colspan="8"><ol>${Array.from({length:n},(_,k)=>{ const x=r.items[k];
          if (!x) return `<li><span class="ans">not answered (exam stopped)</span></li>`;
          return `<li><span class="${x.got===x.max?'y':'n'}">${x.got}/${x.max}</span> ${esc(x.q)}${x.got<x.max && x.a?`<div class="ans">Answer: ${esc(x.a)}${x.ok?` · Right: ${esc(x.ok)}`:''}</div>`:''}</li>`; }).join('')}</ol></td></tr>`; }).join('')}
      </tbody></table>` : `<div class="empty-note">No results yet for ${TPF.cls==='all'?'this grade':esc(clsName(TPF.cls))}.</div>`}
    <p class="tp-note noprint">Tap a student to see every answer. Every student gets a different version of the exam, so the questions in the list can be different. Results are saved in Chrome on this device and sent to the Google Sheet${EXAM.sheet?` (<b>${settings().sheetOn?'on':'off'}</b>)`:''}. Use Excel (CSV) to keep a copy.</p>
  </main>`;
  applyAr();
  TPF.msg='';
  $('#tpBack').onclick=()=>{ TPF.open=null; viewStart(); };

  $$('[data-del]').forEach(b=>b.onclick=async e=>{ e.stopPropagation(); const r=allResults().find(x=>x.id===b.dataset.del); if (!r) return;
    if (!(await ask('Delete this result?', `<b>${esc(r.name)}</b> · ${r.score}/${r.max}. It is deleted from this device. (If it is already in the Google Sheet, delete the row there too.)`, '', 'Delete', 'Cancel', true))) return;
    saveResults(allResults().filter(x=>x.id!==r.id)); viewTeacher(); });
  $('#csvBtn').onclick=()=>exportCSV(list);

  if ($('#syncBtn')) $('#syncBtn').onclick=async ()=>{ const b=$('#syncBtn'); b.disabled=true; b.textContent='Loading…'; await syncAll(); const c=sheetCache(); TPF.msg = c.ok ? '✓ Updated.' : '✗ Could not read the Sheet.'; viewTeacher(); };
}
function exportCSV(list){
  const q = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const n = Math.max(NQ, ...list.map(r=>r.nItems||0));
  const head = ['Grade','Class','Name','Mark','Out of','Percent','Status','Date','Start time','Device', ...Array.from({length:n},(_,k)=>`Q${k+1}`)];
  const rows = list.map(r=>{ const d=new Date(r.start);
    return [r.grade, clsName(r.cls), r.name, r.score, r.max, Math.round(r.score/r.max*100)+'%', r.status, d.toLocaleDateString('en-GB'), d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), r.src==='sheet'?'other device':'this device',
      ...Array.from({length:n},(_,k)=>r.items[k]?`${r.items[k].got}/${r.items[k].max}`:'')]; });
  const lines = [head, ...rows].map(r=>r.map(q).join(','));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`Unit 3 final exam - grade ${EXAM.grade} ${TPF.cls==='all'?'all classes':clsName(TPF.cls)} ${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },800);
}

function viewSheet(){

  $('#shBack').onclick=()=>{ TPF.view='results'; viewTeacher(); };

  $('#copyCode').onclick=()=>{ const done=()=>{ $('#copyCode').textContent='✓ Copied'; };

/* ---------- keep a running exam safe ---------- */
addEventListener('beforeunload', e=>{ if (EX.rec && EX.rec.status==='in progress'){ e.preventDefault(); e.returnValue=''; } });

(function(){ const all=allResults(); let ch=false; all.forEach(r=>{ if (r.status==='in progress'){ r.status='stopped'; ch=true; } }); if (ch) saveResults(all); })();
